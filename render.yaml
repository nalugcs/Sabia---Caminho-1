services:
  - type: web
    name: sabia
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sabia-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_COOKIE_SECURE
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "1"
      - key: REQUIRED_SESSIONS
        value: "3"

databases:
  - name: sabia-db
    plan: free
