<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}sabiá{% endblock %}</title>
  <meta name="description" content="Laboratório de conversação para aprender idiomas.">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/app">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" fill="currentColor"/>
        <rect class="bar bar-a" x="5" y="9" width="2.6" height="6" rx="1.3" fill="#edefe9"/>
        <rect class="bar bar-b" x="10.7" y="5" width="2.6" height="14" rx="1.3" fill="#edefe9"/>
        <rect class="bar bar-c" x="16.4" y="7.5" width="2.6" height="9" rx="1.3" fill="#edefe9"/>
      </svg>
      <span>sabiá</span>
    </a>
    {% if participant %}
    <div class="topbar-right">
      <span class="who">{{ participant.name }}</span>
      <form method="post" action="/sair">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="linklike" type="submit">sair</button>
      </form>
    </div>
    {% endif %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
